name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: E2E & API Test Suite
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          BASE_URL: https://playground.aminhamzah.com
          CUSTOMER_USER: ${{ secrets.CUSTOMER_USER || 'customer' }}
          CUSTOMER_PASS: ${{ secrets.CUSTOMER_PASS || 'rahasia123' }}
          ADMIN_USER: ${{ secrets.ADMIN_USER || 'admin' }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS || 'admin123' }}
          LOCKED_USER: ${{ secrets.LOCKED_USER || 'terkunci' }}
          LOCKED_PASS: ${{ secrets.LOCKED_PASS || 'rahasia123' }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Generate Allure Report
        if: ${{ !cancelled() }}
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
